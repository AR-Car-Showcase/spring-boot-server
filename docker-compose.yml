services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-car_data}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:?SPRING_DATA_REDIS_PASSWORD must be set}
    # Redis holds refresh tokens and signup/reset OTP challenges, so it needs a password
    # and it needs to survive a restart.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    ports:
      # Loopback only. Reached by the app as redis:6379 over the compose network.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  recommendation:
    build: ../recommendation-service
    environment:
      - APP_ENV=production
    ports:
      # Loopback only. Reached by the app as http://recommendation:8000.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src/main/resources/cars_data_final.json:/app/dataset/cars_data_final.json

  app:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      recommendation:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-car_data}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:?SPRING_DATA_REDIS_PASSWORD must be set}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      BLENDER_SERVICE_URL: ${BLENDER_SERVICE_URL}
      ML_SERVICE_URL: http://recommendation:8000
      ML_SERVICE_KEY: ${ML_SERVICE_KEY:-carshowcase_internal_2026}
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      # Loopback only so traffic has to arrive through nginx/Cloudflare.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./src/main/resources/static/models:/app/src/main/resources/static/models

volumes:
  postgres_data:
  redis_data:
